# ===== Server =====
server.port=8080
spring.application.name=ged-tutor

# ===== PostgreSQL (default profile) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/gedtutor
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# "update" lets Hibernate add new columns/tables at startup (e.g. the new
# questions_per_attempt column on homework, and the quiz_attempt_questions
# join table) without dropping existing rows. Use "create-drop" only when
# you intentionally want a clean slate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Logging =====
logging.level.org.springframework.security=INFO
