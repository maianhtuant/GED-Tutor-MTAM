# ===== Server =====
server.port=8080
spring.application.name=ged-tutor
# Explicit session timeout — idle sessions expire after 30 minutes
server.servlet.session.timeout=30m

# ===== PostgreSQL (default profile) =====
# Set these via environment variables — never commit real credentials.
# e.g. export DB_URL=jdbc:postgresql://host:5432/gedtutor
#      export DB_USERNAME=gedtutor_app
#      export DB_PASSWORD=<strong-password>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gedtutor}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# "update" lets Hibernate add new columns/tables at startup (e.g. the new
# questions_per_attempt column on homework, and the quiz_attempt_questions
# join table) without dropping existing rows. Use "create-drop" only when
# you intentionally want a clean slate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Actuator =====
# Only expose health + info publicly; everything else is blocked via SecurityConfig.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ===== Logging =====
logging.level.org.springframework.security=INFO
