<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Video Lessons')}"></head>
<style>
  /* ── Tab bar ──────────────────────────────────────────────── */
  .tab-bar {
    display: flex;
    gap: 0;
    border-bottom: 2px solid #e5e7eb;
    margin-bottom: 1.75rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab-btn {
    padding: 0.65rem 1.3rem;
    font-size: 0.92rem;
    font-weight: 500;
    color: #6b7280;
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .15s, border-color .15s;
  }
  .tab-btn:hover { color: #111; }
  .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 600; }

  /* ── Panels ───────────────────────────────────────────────── */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Search ───────────────────────────────────────────────── */
  .search-bar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1.5rem;
  }
  .search-bar input {
    flex: 1;
    padding: 0.55rem 0.9rem;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  .search-bar input:focus { outline: 2px solid #2563eb; border-color: #2563eb; }
  .search-count { font-size: 0.85rem; color: #888; white-space: nowrap; }

  /* ── Sub-subject sections ─────────────────────────────────── */
  .category-section { margin-bottom: 2.5rem; }
  .category-title {
    font-size: 1rem;
    font-weight: 700;
    color: #374151;
    margin: 0 0 0.9rem;
    padding-bottom: 0.4rem;
    border-bottom: 2px solid #e5e7eb;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .category-title .cat-count {
    font-size: 0.78rem;
    font-weight: 500;
    background: #e5e7eb;
    color: #6b7280;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
  }

  /* ── Video cards ──────────────────────────────────────────── */
  .video-card { text-decoration: none; color: inherit; }
  .video-card[hidden] { display: none !important; }
  .no-results { color: #888; font-style: italic; padding: 1rem 0; }
</style>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container">
  <h1>Video Lessons</h1>
  <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

  <!-- ── Tab bar ── -->
  <div class="tab-bar" id="tabBar">
    <button class="tab-btn" data-tab="all">All
      <span style="font-size:0.75rem;color:#aaa;margin-left:0.3rem;"
            th:text="'(' + ${#lists.size(allVideos)} + ')'"></span>
    </button>
    <button th:each="s : ${subjects}"
            class="tab-btn"
            th:data-tab="${'tab-' + s.id}"
            th:data-subject-id="${s.id}">
      <span th:text="${s.name}">Math</span>
      <span style="font-size:0.75rem;color:#aaa;margin-left:0.3rem;"
            th:text="'(' + ${videosByCat[s.id] != null ? videosByCat[s.id].values().stream().mapToInt(#lists.size(#object)).sum() : 0} + ')'"></span>
    </button>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       "All" panel — flat search across everything
       ══════════════════════════════════════════════════════════ -->
  <div class="tab-panel" id="all">
    <div class="search-bar">
      <input type="text" placeholder="Search all videos…" id="searchAll" autocomplete="off">
      <span class="search-count" id="countAll"></span>
    </div>
    <div th:if="${#lists.isEmpty(allVideos)}" class="empty">No videos yet. Check back soon!</div>
    <div class="grid" id="gridAll">
      <a th:each="v : ${allVideos}"
         th:href="@{|/videos/${v.id}|}"
         class="video-card"
         th:data-title="${v.title?.toLowerCase()}"
         th:data-subject="${v.subject != null ? v.subject.name?.toLowerCase() : ''}"
         th:data-category="${v.category != null ? v.category?.toLowerCase() : ''}">
        <div class="thumb"
             th:if="${v.provider == 'youtube' and v.embedId != null}"
             th:style="|background-image:url('https://img.youtube.com/vi/${v.embedId}/hqdefault.jpg')|"></div>
        <div class="thumb" th:unless="${v.provider == 'youtube' and v.embedId != null}"><span>Watch</span></div>
        <div class="card-body">
          <span class="badge" th:text="${v.subject != null ? v.subject.name : ''}"></span>
          <span th:if="${v.category != null and !v.category.isEmpty()}"
                style="font-size:0.75rem;color:#888;margin-left:0.3rem;"
                th:text="${v.category}"></span>
          <h3 th:text="${v.title}">Title</h3>
          <p class="muted" th:text="${#temporals.format(v.createdAt,'MMM d, yyyy')}">Date</p>
        </div>
      </a>
    </div>
    <p class="no-results" id="noResultsAll" style="display:none;">No videos match your search.</p>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       Per-subject panels with sub-subject sections + search
       ══════════════════════════════════════════════════════════ -->
  <div th:each="s : ${subjects}"
       class="tab-panel"
       th:id="'tab-' + ${s.id}">

    <!-- Search field -->
    <div class="search-bar">
      <input type="text"
             th:placeholder="'Search ' + ${s.name} + ' videos…'"
             th:id="'search-' + ${s.id}"
             autocomplete="off">
      <span class="search-count" th:id="'count-' + ${s.id}"></span>
    </div>

    <!-- No videos at all -->
    <div th:if="${videosByCat[s.id] == null or #maps.isEmpty(videosByCat[s.id])}" class="empty">
      No videos in this subject yet.
    </div>

    <!-- Sub-subject sections -->
    <div th:if="${videosByCat[s.id] != null and !#maps.isEmpty(videosByCat[s.id])}"
         th:id="'sections-' + ${s.id}">
      <div th:each="entry : ${videosByCat[s.id]}"
           class="category-section"
           th:id="'cat-' + ${s.id} + '-' + ${entry.key}">
        <h2 class="category-title">
          <span th:text="${entry.key}">Category</span>
          <span class="cat-count" th:text="${#lists.size(entry.value)}">0</span>
        </h2>
        <div class="grid"
             th:id="'grid-' + ${s.id} + '-' + ${entry.key}">
          <a th:each="v : ${entry.value}"
             th:href="@{|/videos/${v.id}|}"
             class="video-card"
             th:data-title="${v.title?.toLowerCase()}"
             th:data-category="${v.category != null ? v.category?.toLowerCase() : 'general'}">
            <div class="thumb"
                 th:if="${v.provider == 'youtube' and v.embedId != null}"
                 th:style="|background-image:url('https://img.youtube.com/vi/${v.embedId}/hqdefault.jpg')|"></div>
            <div class="thumb" th:unless="${v.provider == 'youtube' and v.embedId != null}"><span>Watch</span></div>
            <div class="card-body">
              <h3 th:text="${v.title}">Title</h3>
              <p class="muted" th:text="${#temporals.format(v.createdAt,'MMM d, yyyy')}">Date</p>
            </div>
          </a>
        </div>
      </div>
      <p class="no-results" th:id="'noResults-' + ${s.id}" style="display:none;">
        No videos match your search.
      </p>
    </div>
  </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:inline="javascript">
(function () {
    // ── Tab switching ──────────────────────────────────────────
    const tabBar  = document.getElementById('tabBar');
    const tabBtns = Array.from(tabBar.querySelectorAll('.tab-btn'));
    const panels  = Array.from(document.querySelectorAll('.tab-panel'));

    function activate(tabId) {
        tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
        panels.forEach(p  => p.classList.toggle('active', p.id === tabId));
        try { sessionStorage.setItem('videosTab', tabId); } catch(_) {}
    }

    tabBtns.forEach(btn => btn.addEventListener('click', () => activate(btn.dataset.tab)));

    let saved = 'all';
    try { saved = sessionStorage.getItem('videosTab') || 'all'; } catch(_) {}
    if (!panels.find(p => p.id === saved)) saved = 'all';
    activate(saved);

    // ── Search: All tab ────────────────────────────────────────
    const searchAll    = document.getElementById('searchAll');
    const gridAll      = document.getElementById('gridAll');
    const countAll     = document.getElementById('countAll');
    const noResultsAll = document.getElementById('noResultsAll');

    if (searchAll && gridAll) {
        const allCards = Array.from(gridAll.querySelectorAll('.video-card'));
        searchAll.addEventListener('input', () => {
            const q = searchAll.value.trim().toLowerCase();
            let shown = 0;
            allCards.forEach(c => {
                const match = !q
                    || (c.dataset.title || '').includes(q)
                    || (c.dataset.subject || '').includes(q)
                    || (c.dataset.category || '').includes(q);
                c.hidden = !match;
                if (match) shown++;
            });
            countAll.textContent = q ? shown + ' result' + (shown !== 1 ? 's' : '') : '';
            noResultsAll.style.display = (q && shown === 0) ? 'block' : 'none';
        });
    }

    // ── Search: per-subject tabs ───────────────────────────────
    /*[[ ${subjects} ]]*/ [].forEach(() => {}); // placeholder — real data below
    document.querySelectorAll('.tab-panel[id^="tab-"]').forEach(panel => {
        const sid      = panel.id.replace('tab-', '');
        const input    = document.getElementById('search-' + sid);
        const counter  = document.getElementById('count-' + sid);
        const noRes    = document.getElementById('noResults-' + sid);
        const sections = panel.querySelectorAll('.category-section');
        if (!input || sections.length === 0) return;

        const allCards = Array.from(panel.querySelectorAll('.video-card'));

        input.addEventListener('input', () => {
            const q = input.value.trim().toLowerCase();
            let totalShown = 0;

            sections.forEach(section => {
                const cards = Array.from(section.querySelectorAll('.video-card'));
                let sectionShown = 0;
                cards.forEach(c => {
                    const match = !q
                        || (c.dataset.title || '').includes(q)
                        || (c.dataset.category || '').includes(q);
                    c.hidden = !match;
                    if (match) sectionShown++;
                });
                // Hide entire section if no cards match
                section.style.display = sectionShown === 0 ? 'none' : '';
                totalShown += sectionShown;
            });

            counter.textContent = q ? totalShown + ' result' + (totalShown !== 1 ? 's' : '') : '';
            if (noRes) noRes.style.display = (q && totalShown === 0) ? 'block' : 'none';
        });
    });
})();
</script>
</body>
</html>
