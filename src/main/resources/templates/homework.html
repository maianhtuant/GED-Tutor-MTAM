<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quizzes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container">
    <h1>Quizzes</h1>
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <div th:if="${#lists.isEmpty(allHomework)}" class="empty">No quizzes assigned yet.</div>

    <table class="table" th:if="${!#lists.isEmpty(allHomework)}">
        <thead>
        <tr><th>Title</th><th>Subject</th><th>Due</th><th>Status</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="hw : ${allHomework}">
            <td th:text="${hw.title}">Title</td>
            <td th:text="${hw.subject != null ? hw.subject.name : '—'}">Math</td>
            <td th:text="${hw.dueDate != null ? #temporals.format(hw.dueDate,'MMM d, yyyy HH:mm') : '—'}">—</td>
            <td>
                <span class="muted">Open to see status</span>
            </td>
            <td>
                <a th:href="@{|/quiz/${hw.id}|}" class="btn btn-primary">Take Quiz</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
