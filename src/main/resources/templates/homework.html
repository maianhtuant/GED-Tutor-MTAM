<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Homework')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container">
    <h1>Homework</h1>
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <div th:if="${#lists.isEmpty(homework)}" class="empty">No homework assigned yet.</div>

    <table class="table" th:if="${!#lists.isEmpty(homework)}">
        <thead>
        <tr><th>Title</th><th>Subject</th><th>Due</th><th>Status</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="hw : ${homework}">
            <td th:text="${hw.title}">Title</td>
            <td th:text="${hw.subject}">MATH</td>
            <td th:text="${hw.dueDate != null ? #temporals.format(hw.dueDate,'MMM d, yyyy HH:mm') : '—'}">—</td>
            <td>
                <span class="muted">Open to see status</span>
            </td>
            <td>
                <a th:href="@{|/homework/${hw.id}|}" class="btn">Open</a>
                <a th:href="@{|/quiz/${hw.id}|}" class="btn btn-primary" style="margin-left:0.3rem;">Take Quiz</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
