<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Homework form')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container narrow">
    <a th:href="@{/admin/homework}" class="back-link">&larr; Back</a>
    <h1 th:text="${form.id != null ? 'Edit homework' : 'New homework'}">Homework</h1>

    <form th:action="${form.id != null} ? @{|/admin/homework/${form.id}/edit|} : @{/admin/homework/new}"
          th:object="${form}" method="post" class="card">

        <label>Title
            <input type="text" th:field="*{title}" required>
        </label>

        <label>Subject
            <select th:field="*{subjectId}" required id="subjectSelect">
                <option value="">— choose a subject —</option>
                <option th:each="s : ${subjects}"
                        th:value="${s.id}"
                        th:text="${s.name}"
                        th:attr="data-name=${s.name}"></option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('subjectId')}" th:errors="*{subjectId}"></span>
        </label>

        <label>Sub-subject / Category
            <input type="text" th:field="*{category}" id="categoryInput"
                   list="categoryList"
                   placeholder="e.g. GED, Calculus 1, Pre-Calculus…"
                   autocomplete="off">
            <datalist id="categoryList"></datalist>
            <small class="muted">Groups this homework inside its subject tab on the student page.</small>
        </label>

        <label>Related video (optional)
            <select th:field="*{videoId}">
                <option value="">— none —</option>
                <option th:each="v : ${videos}" th:value="${v.id}" th:text="${v.title}"></option>
            </select>
        </label>

        <label>Due date (optional)
            <input type="datetime-local" th:field="*{dueDate}">
        </label>

        <label>Instructions
            <textarea th:field="*{instructions}" rows="8"></textarea>
        </label>

        <label>Total questions (pool size)
            <input type="number" th:field="*{poolSize}" min="0" placeholder="e.g. 10">
            <small class="muted">How many questions you plan to add for this homework. After saving you'll be taken to a form to enter each one, showing "Question X of Y". Leave blank if you don't want a target.</small>
        </label>

        <label>Questions per attempt (optional)
            <input type="number" th:field="*{questionsPerAttempt}" min="0" placeholder="Leave blank to use all">
            <small class="muted">If set, each attempt randomly picks this many questions from the pool. Leave blank or 0 for "use all".</small>
        </label>

        <label class="inline">
            <input type="checkbox" th:field="*{published}">
            Published (visible to students)
        </label>

        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>
    const CATEGORIES = {
        'Math':          ['GED', 'Pre-Calculus', 'Calculus 1', 'Calculus 2', 'Calculus 3', 'Linear Algebra', 'Differential Equations', 'Statistics', 'Trigonometry'],
        'Science':       ['GED', 'Biology', 'Chemistry', 'Physics', 'Earth Science'],
        'Social Studies':['GED', 'US History', 'World History', 'Civics', 'Geography', 'Economics'],
        'Language Arts': ['GED', 'Reading', 'Writing', 'Grammar', 'Essay Writing', 'Literature'],
        'Reasoning':     ['GED', 'Critical Thinking', 'Logic', 'Problem Solving']
    };
    const subjectSelect = document.getElementById('subjectSelect');
    const categoryList  = document.getElementById('categoryList');
    function updateSuggestions() {
        const opt  = subjectSelect.options[subjectSelect.selectedIndex];
        const name = opt ? (opt.dataset.name || opt.text) : '';
        const opts = CATEGORIES[name] || ['GED'];
        categoryList.innerHTML = opts.map(o => `<option value="${o}"></option>`).join('');
    }
    subjectSelect.addEventListener('change', updateSuggestions);
    updateSuggestions();
</script>
</body>
</html>
