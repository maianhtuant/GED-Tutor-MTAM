<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lesson form')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container narrow">
    <a th:href="@{/admin/videos}" class="back-link">&larr; Back to lessons</a>
    <h1 th:text="${form.id != null ? 'Edit lesson' : 'New lesson'}">Lesson</h1>

    <form th:action="${form.id != null} ? @{|/admin/videos/${form.id}/edit|} : @{/admin/videos/new}"
          th:object="${form}" method="post" class="card">

        <label>Title
            <input type="text" th:field="*{title}" required>
            <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </label>

        <label>Video URL (YouTube or Vimeo)
            <input type="url" th:field="*{videoUrl}" required
                   placeholder="https://www.youtube.com/watch?v=...">
            <span class="field-error" th:if="${#fields.hasErrors('videoUrl')}" th:errors="*{videoUrl}"></span>
        </label>

        <label>Description
            <textarea th:field="*{description}" rows="5"></textarea>
        </label>

        <label>Subject
            <select th:field="*{subjectId}" required id="subjectSelect">
                <option value="">— choose a subject —</option>
                <option th:each="s : ${subjects}"
                        th:value="${s.id}"
                        th:text="${s.name}"
                        th:attr="data-name=${s.name}"></option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('subjectId')}" th:errors="*{subjectId}"></span>
        </label>

        <label>Sub-subject / Category
            <input type="text" th:field="*{category}" id="categoryInput"
                   list="categoryList"
                   placeholder="e.g. GED, Calculus 1, Pre-Calculus…"
                   autocomplete="off">
            <datalist id="categoryList"></datalist>
            <small class="muted">Groups this video under a course within the subject tab.</small>
        </label>

        <label>Visibility
            <select th:field="*{visibility}" required>
                <option th:each="vis : ${visibilities}" th:value="${vis}" th:text="${vis}"></option>
            </select>
        </label>

        <label>Math practice model
            <select th:field="*{mathTemplateId}">
                <option value="">— none —</option>
                <option th:each="t : ${mathTemplates}"
                        th:value="${t.id}"
                        th:text="${t.label + ' (' + t.kind + ')'}">
                </option>
            </select>
            <small class="muted">
                When set, the video's sidebar will show this template's label and link students
                to a live practice problem of that type.
                <a th:href="@{/admin/math-templates}" target="_blank" style="color:var(--accent-ink);">Manage templates ↗</a>
            </small>
        </label>

        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    // Predefined category suggestions per subject name
    const CATEGORIES = {
        'Math': ['GED', 'Pre-Calculus', 'Calculus 1', 'Calculus 2', 'Calculus 3',
                 'Linear Algebra', 'Differential Equations', 'Statistics', 'Trigonometry'],
        'Science': ['GED', 'Biology', 'Chemistry', 'Physics', 'Earth Science'],
        'Social Studies': ['GED', 'US History', 'World History', 'Civics', 'Geography', 'Economics'],
        'Language Arts': ['GED', 'Reading', 'Writing', 'Grammar', 'Essay Writing', 'Literature'],
        'Reasoning': ['GED', 'Critical Thinking', 'Logic', 'Problem Solving']
    };

    const subjectSelect  = document.getElementById('subjectSelect');
    const categoryInput  = document.getElementById('categoryInput');
    const categoryList   = document.getElementById('categoryList');

    function updateSuggestions() {
        const selected = subjectSelect.options[subjectSelect.selectedIndex];
        const name = selected ? selected.dataset.name || selected.text : '';
        const options = CATEGORIES[name] || ['GED'];
        categoryList.innerHTML = options
            .map(o => `<option value="${o}"></option>`)
            .join('');
    }

    subjectSelect.addEventListener('change', updateSuggestions);
    updateSuggestions(); // run on page load for edit form
</script>
</body>
</html>
