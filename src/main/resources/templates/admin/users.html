<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Users')}"></head>
<style>
  .add-user-card {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 1.5rem 2rem;
    margin-bottom: 2rem;
  }
  .add-user-card h2 {
    margin: 0 0 1.2rem;
    font-size: 1.05rem;
    font-weight: 700;
    color: #374151;
  }
  .add-user-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
    gap: 0.75rem;
    align-items: end;
  }
  .add-user-grid label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: #6b7280;
    margin-bottom: 0.3rem;
  }
  .add-user-grid input,
  .add-user-grid select {
    width: 100%;
    padding: 0.5rem 0.75rem;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    font-size: 0.92rem;
    box-sizing: border-box;
  }
  .add-user-grid input:focus,
  .add-user-grid select:focus {
    outline: 2px solid #2563eb;
    border-color: #2563eb;
  }
  .search-wrap {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .search-wrap input {
    padding: 0.5rem 0.85rem;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    font-size: 0.92rem;
    width: 280px;
  }
  .user-count { font-size: 0.85rem; color: #9ca3af; }
  .inline-form { display: inline; }
  .action-wrap { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
  .action-wrap input[type=password] { width: 130px; }
  .activity-none { color: #9ca3af; font-size: 0.85rem; }
  .activity-link { background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; white-space: nowrap; }
</style>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;">
    <h1 style="margin:0;">Users</h1>
    <a th:href="@{/admin/users/activity}" class="btn">View Activity by Subject →</a>
  </div>

  <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
  <div class="alert alert-error"   th:if="${error}"   th:text="${error}"></div>

  <!-- ── Add User ─────────────────────────────────────────────── -->
  <div class="add-user-card">
    <h2>Add New User</h2>
    <form th:action="@{/admin/users/create}" method="post">
      <div class="add-user-grid">
        <div>
          <label>Username *</label>
          <input type="text" name="username" required placeholder="e.g. jsmith">
        </div>
        <div>
          <label>Email *</label>
          <input type="email" name="email" required placeholder="john@example.com">
        </div>
        <div>
          <label>Full Name</label>
          <input type="text" name="fullName" placeholder="John Smith">
        </div>
        <div>
          <label>Password *</label>
          <input type="password" name="password" required minlength="6" placeholder="Min 6 chars">
        </div>
        <div>
          <label>Role *</label>
          <select name="role">
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">STUDENT</option>
          </select>
        </div>
        <div>
          <label>&nbsp;</label>
          <button type="submit" class="btn" style="width:100%">Create User</button>
        </div>
      </div>
    </form>
  </div>

  <!-- ── Search ───────────────────────────────────────────────── -->
  <div class="search-wrap">
    <input type="text" id="userSearch" placeholder="Search users…" autocomplete="off">
    <span class="user-count" id="userCount"
          th:text="${#lists.size(users)} + ' users'"></span>
  </div>

  <!-- ── User Table ────────────────────────────────────────────── -->
  <table class="table" id="userTable">
    <thead>
    <tr>
      <th>Username</th>
      <th>Email</th>
      <th>Full Name</th>
      <th>Role</th>
      <th>Status</th>
      <th>Joined</th>
      <th>Activity</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${users}"
        th:data-search="${(u.username + ' ' + u.email + ' ' + (u.fullName ?: '')).toLowerCase()}">
      <td th:text="${u.username}">user</td>
      <td th:text="${u.email}">a@b.com</td>
      <td th:text="${u.fullName ?: '—'}">Name</td>

      <!-- Role selector -->
      <td>
        <form th:action="@{|/admin/users/${u.id}/role|}" method="post" class="inline-form">
          <select name="role" onchange="this.form.submit()" style="font-size:0.85rem">
            <option th:each="r : ${roles}"
                    th:value="${r}"
                    th:text="${r}"
                    th:selected="${u.role == r}"></option>
          </select>
        </form>
      </td>

      <!-- Enabled toggle -->
      <td>
        <form th:action="@{|/admin/users/${u.id}/enabled|}" method="post" class="inline-form">
          <input type="hidden" name="enabled" th:value="${!u.enabled}">
          <button type="submit" class="btn"
                  th:classappend="${u.enabled ? '' : ' btn-danger'}"
                  style="font-size:0.8rem;padding:0.25rem 0.65rem;"
                  th:text="${u.enabled ? 'Active ✓' : 'Disabled'}">Active</button>
        </form>
      </td>

      <!-- Joined date -->
      <td style="font-size:0.85rem;color:#6b7280;"
          th:text="${#temporals.format(u.createdAt,'MMM d, yyyy')}">Jan 1</td>

      <!-- Quiz / practice activity -->
      <td th:with="act=${activity.get(u.id)}" style="min-width:150px;">
        <span th:if="${act == null}" class="activity-none">No attempts yet</span>
        <a th:if="${act != null}" th:href="@{|/admin/users/${u.id}/activity|}"
           class="btn activity-link" style="font-size:0.8rem;padding:0.25rem 0.6rem;"
           th:text="${act.totalAttempts + (act.totalAttempts == 1 ? ' attempt' : ' attempts') + ' →'}">
          5 attempts →
        </a>
      </td>

      <!-- Reset PW + Delete -->
      <td>
        <div class="action-wrap">
          <form th:action="@{|/admin/users/${u.id}/reset-password|}" method="post" class="inline-form">
            <div class="action-wrap">
              <input type="password" name="newPassword" placeholder="New password" required minlength="6">
              <button type="submit" class="btn" style="font-size:0.8rem;padding:0.28rem 0.65rem;">Reset PW</button>
            </div>
          </form>
          <form th:action="@{|/admin/users/${u.id}/delete|}" method="post" class="inline-form"
                onsubmit="return confirm('Delete user ' + this.closest('tr').querySelector('td').textContent.trim() + '?');">
            <button type="submit" class="btn btn-danger" style="font-size:0.8rem;padding:0.28rem 0.65rem;">Delete</button>
          </form>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
  <p id="noUsers" style="display:none;color:#888;font-style:italic;">No users match your search.</p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
(function () {
  const input   = document.getElementById('userSearch');
  const counter = document.getElementById('userCount');
  const noUsers = document.getElementById('noUsers');
  const rows    = Array.from(document.querySelectorAll('#userTable tbody tr'));
  const total   = rows.length;

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    let shown = 0;
    rows.forEach(r => {
      const match = !q || (r.dataset.search || '').includes(q);
      r.style.display = match ? '' : 'none';
      if (match) shown++;
    });
    counter.textContent = q ? shown + ' of ' + total + ' users' : total + ' users';
    noUsers.style.display = (q && shown === 0) ? 'block' : 'none';
  });
})();
</script>
</body>
</html>
