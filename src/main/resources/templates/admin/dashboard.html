<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container">
    <h1>Admin Dashboard</h1>
    <div class="stats">
        <div class="stat">
            <h2 th:text="${videoCount}">0</h2>
            <p>Videos</p>
            <a th:href="@{/admin/videos}">Manage &rarr;</a>
        </div>
        <div class="stat">
            <h2 th:text="${userCount}">0</h2>
            <p>Users</p>
            <a th:href="@{/admin/users}">Manage &rarr;</a>
        </div>
        <div class="stat">
            <h2 th:text="${homeworkCount}">0</h2>
            <p>Quizzes</p>
            <a th:href="@{/admin/homework}">Manage &rarr;</a>
        </div>
        <div class="stat">
            <h2 th:text="${questionCount}">0</h2>
            <p>Questions</p>
            <a th:href="@{/admin/questions}">Manage &rarr;</a>
        </div>
        <div class="stat">
            <h2 th:text="${subjectCount}">0</h2>
            <p>Subjects</p>
            <a th:href="@{/admin/subjects}">Manage &rarr;</a>
        </div>
        <div class="stat">
            <h2>&nbsp;</h2>
            <p>Practice sets</p>
            <a th:href="@{/admin/practice-sets}">Manage &rarr;</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
