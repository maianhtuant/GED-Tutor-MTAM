<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Question')}"></head>
<style>
  .choices-section { display:none; margin-top:0.5rem; }
  .fill-hint { display:none; font-size:0.85rem; color:#666; margin-top:0.3rem; }
</style>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container narrow">
    <a th:href="@{/admin/questions}" class="back-link">&larr; Back to Questions</a>
    <h1 th:text="${form.id == null} ? 'Add Question' : 'Edit Question'">Question</h1>

    <form th:action="${form.id == null} ? @{/admin/questions/new} : @{|/admin/questions/${form.id}/edit|}"
          method="post" id="questionForm" class="card">

        <label>Subject
            <select name="subjectId" required>
                <option value="">— choose a subject —</option>
                <option th:each="s : ${subjects}"
                        th:value="${s.id}"
                        th:text="${s.name}"
                        th:selected="${form.subjectId != null and form.subjectId == s.id}"></option>
            </select>
            <span class="field-error"
                  th:if="${#fields.hasErrors('form.subjectId')}">Please pick a subject.</span>
        </label>

        <label>Question Type
            <select name="type" id="typeSelect" required>
                <option value="">-- Select type --</option>
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"
                        th:selected="${form.type == t}"></option>
            </select>
        </label>

        <label>Question Text
            <textarea name="questionText" rows="3" required
                      th:text="${form.questionText}"></textarea>
        </label>

        <!-- Multiple choice options -->
        <div class="choices-section" id="choicesSection">
            <label>Answer Choices (enter 4 options)</label>
            <div th:each="i : ${#numbers.sequence(0, 3)}" style="margin-bottom:0.4rem;">
                <input type="text" th:name="'choices[' + ${i} + ']'"
                       th:value="${#lists.size(form.choices) > i} ? ${form.choices[i]} : ''"
                       th:placeholder="'Choice ' + (${i} + 1)">
            </div>
            <label>Correct Answer
                <input type="text" name="correctAnswer" id="correctAnswerMC"
                       th:value="${form.correctAnswer}"
                       placeholder="Must match one of the choices exactly">
            </label>
        </div>

        <!-- True/False -->
        <div id="tfSection" style="display:none;">
            <label>Correct Answer
                <select name="correctAnswer" id="correctAnswerTF">
                    <option value="true" th:selected="${form.correctAnswer == 'true'}">True</option>
                    <option value="false" th:selected="${form.correctAnswer == 'false'}">False</option>
                </select>
            </label>
        </div>

        <!-- Fill in the blank -->
        <div id="fillSection" style="display:none;">
            <label>Correct Answer
                <input type="text" name="correctAnswer" id="correctAnswerFill"
                       th:value="${form.correctAnswer}"
                       placeholder="The expected answer (case-insensitive)">
            </label>
            <div class="fill-hint" id="fillHint">Tip: partial matches are accepted.</div>
        </div>

        <label>Explanation (optional — shown after answering)
            <textarea name="explanation" rows="2"
                      th:text="${form.explanation}"></textarea>
        </label>

        <input type="hidden" name="orderIndex" th:value="${form.orderIndex}">

        <button type="submit" class="btn btn-primary">Save Question</button>
        <a th:href="@{/admin/questions}" class="btn">Cancel</a>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:inline="javascript" th:attr="nonce=${_cspNonce}">
    const savedType = /*[[${form.type}]]*/ null;

    // Same logic as the per-homework question form: disable hidden sections
    // so only ONE correctAnswer input is submitted.
    const SECTION_IDS = ['choicesSection', 'tfSection', 'fillSection'];

    function setSectionEnabled(sectionId, enabled) {
        const section = document.getElementById(sectionId);
        if (!section) return;
        section.style.display = enabled ? 'block' : 'none';
        section.querySelectorAll('input, select, textarea').forEach(el => {
            el.disabled = !enabled;
        });
    }

    function showFieldsForType(type) {
        SECTION_IDS.forEach(id => setSectionEnabled(id, false));
        document.getElementById('fillHint').style.display = 'none';

        if (type === 'MULTIPLE_CHOICE') {
            setSectionEnabled('choicesSection', true);
        } else if (type === 'TRUE_FALSE') {
            setSectionEnabled('tfSection', true);
        } else if (type === 'FILL_BLANK') {
            setSectionEnabled('fillSection', true);
            document.getElementById('fillHint').style.display = 'block';
        }
    }

    document.getElementById('typeSelect').addEventListener('change', function() {
        showFieldsForType(this.value);
    });

    SECTION_IDS.forEach(id => setSectionEnabled(id, false));
    if (savedType) showFieldsForType(savedType);
</script>
</body>
</html>
