<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Math Templates')}"></head>
<style>
  .template-count-line { margin-bottom: .6rem; font-size: .85rem; color: #9ca3af; }
  .filter-row th {
    padding: .35rem .5rem;
    background: #fff;
    font-weight: 400;
  }
  .filter-row input,
  .filter-row select {
    width: 100%;
    box-sizing: border-box;
    padding: .35rem .5rem;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: .82rem;
    font-weight: 400;
    color: #374151;
  }
</style>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container">
    <div class="page-header">
        <h1>Math Templates</h1>
        <div style="display:flex; gap:.5rem;">
            <a th:href="@{/admin/math-templates/new-quadratic}" class="btn btn-primary">+ Quadratic</a>
            <a th:href="@{/admin/math-templates/new}" class="btn">+ Free-Form</a>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(rows)}" class="empty-state">
        <p>No templates yet.</p>
        <a th:href="@{/admin/math-templates/new-quadratic}" class="btn btn-primary">Add Quadratic Template</a>
    </div>

    <div th:unless="${#lists.isEmpty(rows)}" class="template-count-line">
        <span id="templateCount" th:text="${#lists.size(rows)} + ' templates'"></span>
    </div>

    <!-- Template list -->
    <table th:unless="${#lists.isEmpty(rows)}" class="table" id="templateTable">
        <thead>
            <tr>
                <th>Kind</th>
                <th>Label</th>
                <th>Summary</th>
                <th>Subject</th>
                <th>Mode</th>
                <th>Actions</th>
            </tr>
            <tr class="filter-row">
                <th>
                    <select id="filterKind">
                        <option value="">filter here</option>
                        <option value="QUADRATIC">Quadratic</option>
                        <option value="FREE_FORM">Free-Form</option>
                    </select>
                </th>
                <th><input type="text" id="filterLabel" placeholder="filter here" autocomplete="off"></th>
                <th></th>
                <th><input type="text" id="filterSubject" placeholder="filter here" autocomplete="off"></th>
                <th>
                    <select id="filterMode">
                        <option value="">filter here</option>
                        <option value="FILL_IN_BLANK">Fill-in-blank</option>
                        <option value="MULTIPLE_CHOICE">Multiple-choice</option>
                    </select>
                </th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="row : ${rows}"
                th:attr="data-kind=${row.kind()},
                          data-label=${#strings.toLowerCase(row.label())},
                          data-subject=${#strings.toLowerCase(row.subjectName())},
                          data-mode=${row.answerMode()}">
                <td>
                    <span th:if="${row.kind() == 'QUADRATIC'}"
                          style="background:#0d6efd; color:#fff; padding:.15rem .45rem; border-radius:4px; font-size:.75rem;">QUADRATIC</span>
                    <span th:if="${row.kind() == 'FREE_FORM'}"
                          style="background:#6c757d; color:#fff; padding:.15rem .45rem; border-radius:4px; font-size:.75rem;">FREE_FORM</span>
                </td>
                <td th:text="${row.label()}">Label</td>
                <td><code th:text="${row.summary()}">—</code></td>
                <td th:text="${row.subjectName()}">—</td>
                <td>
                    <span th:if="${row.answerMode() == 'MULTIPLE_CHOICE'}"
                          style="background:#8b5cf6; color:#fff; padding:.15rem .45rem; border-radius:4px; font-size:.75rem;">Multiple-choice</span>
                    <span th:if="${row.answerMode() == 'FILL_IN_BLANK'}"
                          style="background:#e5e7eb; color:#374151; padding:.15rem .45rem; border-radius:4px; font-size:.75rem;">Fill-in-blank</span>
                </td>
                <td>
                    <!-- Preview only available for FREE_FORM -->
                    <a th:if="${row.kind() == 'FREE_FORM'}"
                       th:href="@{/admin/math-templates/{id}/preview(id=${row.id()})}"
                       class="btn btn-sm btn-success">▶ Preview</a>
                    <!-- Edit routes differ by kind -->
                    <a th:if="${row.kind() == 'QUADRATIC'}"
                       th:href="@{/admin/math-templates/{id}/edit-quadratic(id=${row.id()})}"
                       class="btn btn-sm">✏ Edit</a>
                    <a th:if="${row.kind() == 'FREE_FORM'}"
                       th:href="@{/admin/math-templates/{id}/edit(id=${row.id()})}"
                       class="btn btn-sm">✏ Edit</a>
                    <form th:action="@{/admin/math-templates/{id}/delete(id=${row.id()})}"
                          method="post" style="display:inline"
                          onsubmit="return confirm('Delete this template?')">
                        <button type="submit" class="btn btn-sm btn-danger">🗑 Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <p th:unless="${#lists.isEmpty(rows)}" id="noTemplates" style="display:none;color:#888;font-style:italic;">No templates match your filters.</p>

    <div style="margin-top:1.5rem;">
        <a th:href="@{/admin}" class="btn">← Back to Dashboard</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:unless="${#lists.isEmpty(rows)}" th:attr="nonce=${_cspNonce}">
(function () {
    const kindSel     = document.getElementById('filterKind');
    const labelInput  = document.getElementById('filterLabel');
    const subjectInput = document.getElementById('filterSubject');
    const modeSel      = document.getElementById('filterMode');
    const counter      = document.getElementById('templateCount');
    const noRows        = document.getElementById('noTemplates');
    const rows           = Array.from(document.querySelectorAll('#templateTable tbody tr'));
    const total           = rows.length;

    function applyFilters() {
        const kind    = kindSel.value;
        const label   = labelInput.value.trim().toLowerCase();
        const subject = subjectInput.value.trim().toLowerCase();
        const mode    = modeSel.value;
        const active  = !!(kind || label || subject || mode);

        let shown = 0;
        rows.forEach(r => {
            const match = (!kind || r.dataset.kind === kind)
                && (!label || (r.dataset.label || '').includes(label))
                && (!subject || (r.dataset.subject || '').includes(subject))
                && (!mode || r.dataset.mode === mode);
            r.style.display = match ? '' : 'none';
            if (match) shown++;
        });
        counter.textContent = active ? shown + ' of ' + total + ' templates' : total + ' templates';
        noRows.style.display = (active && shown === 0) ? 'block' : 'none';
    }

    kindSel.addEventListener('change', applyFilters);
    labelInput.addEventListener('input', applyFilters);
    subjectInput.addEventListener('input', applyFilters);
    modeSel.addEventListener('change', applyFilters);
})();
</script>
</body>
</html>
