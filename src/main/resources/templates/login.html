<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container narrow">
    <h1>Log in</h1>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-success" th:if="${param.registered}">
        Registration successful — please log in.
    </div>

    <form th:action="@{/login}" method="post" class="card">
        <label>Username or email
            <input type="text" name="username" required autofocus>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <p>New here? <a th:href="@{/register}">Create an account</a>.</p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
